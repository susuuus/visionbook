<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANSAC Algorithm Visualization</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>RANSAC Algorithm Visualization</h1>
        <p>Use the mouse to orbit around the scene.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.minDistance = 5;
        controls.maxDistance = 20;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // Helper axes
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // Data points
        const dataPointsGeometry = new THREE.BufferGeometry();
        const dataPointsMaterial = new THREE.PointsMaterial({ size: 0.1, color: 0x808080 });
        const dataPoints = new THREE.Points(dataPointsGeometry, dataPointsMaterial);
        scene.add(dataPoints);

        // Inlier points
        const inlierPointsGeometry = new THREE.BufferGeometry();
        const inlierPointsMaterial = new THREE.PointsMaterial({ size: 0.1, color: 0x00BFFF });
        const inlierPoints = new THREE.Points(inlierPointsGeometry, inlierPointsMaterial);
        scene.add(inlierPoints);

        // Outlier points
        const outlierPointsGeometry = new THREE.BufferGeometry();
        const outlierPointsMaterial = new THREE.PointsMaterial({ size: 0.1, color: 0x333333 });
        const outlierPoints = new THREE.Points(outlierPointsGeometry, outlierPointsMaterial);
        scene.add(outlierPoints);

        // Model plane
        const modelPlaneGeometry = new THREE.PlaneGeometry(5, 5);
        const modelPlaneMaterial = new THREE.MeshPhongMaterial({ color: 0x4D4D4D, opacity: 0.5, transparent: true });
        const modelPlane = new THREE.Mesh(modelPlaneGeometry, modelPlaneMaterial);
        scene.add(modelPlane);

        // Animation setup
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the model plane
            const elapsedTime = clock.getElapsedTime();
            modelPlane.rotation.y = 0.5 * elapsedTime;

            controls.update();
            renderer.render(scene, camera);
        }

        // Responsive resizing
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // Start animation
        animate();
    </script>
</body>
</html>
