<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homography in Computer Vision</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100%;
            color: white;
            font-family: Monospace;
            font-size: 13px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="info">
        <p>Homography Transformation: Visualizing the relationship between two planes in 3D space.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.minDistance = 5;
        controls.maxDistance = 20;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040); // Soft white light
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1).normalize();
        scene.add(directionalLight);

        // Plane 1
        const plane1Geometry = new THREE.PlaneGeometry(5, 5);
        const plane1Material = new THREE.MeshPhongMaterial({ color: 'blue', opacity: 0.5, transparent: true });
        const plane1 = new THREE.Mesh(plane1Geometry, plane1Material);
        plane1.position.set(-2.5, 0, 0);
        scene.add(plane1);

        // Plane 2
        const plane2Geometry = new THREE.PlaneGeometry(5, 5);
        const plane2Material = new THREE.MeshPhongMaterial({ color: 'green', opacity: 0.5, transparent: true });
        const plane2 = new THREE.Mesh(plane2Geometry, plane2Material);
        plane2.position.set(2.5, 0, 0);
        scene.add(plane2);

        // Line projection
        const lineMaterial = new THREE.LineBasicMaterial({ color: 'red' });
        const points = [];
        points.push(new THREE.Vector3(-2.5, 0, 0));
        points.push(new THREE.Vector3(2.5, 0, 0));
        const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const lineProjection = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(lineProjection);

        // Animation
        const animate = function () {
            requestAnimationFrame(animate);

            // Example animation: Rotate the line projection
            lineProjection.rotation.y += 0.01;

            controls.update();
            renderer.render(scene, camera);
        };

        // Responsive design
        window.addEventListener('resize', function () {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
