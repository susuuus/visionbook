<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light-Surface Interaction</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, surface;
        let incidentRay, normalVector, reflectedRays = [];
        let incidentRayComponents = []; // <-- Store incident ray parts
        let animating = true;
        let time = 0;
        
        // Mouse rotation variables
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraRotation = { theta: 0.46, phi: 0.32 }; // Slight side angle like original
        let cameraDistance = 4.7;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            
            // Camera - Orthographic for trapezoid appearance, positioned to show on right side
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 8;
            camera = new THREE.OrthographicCamera(
                frustumSize * aspect / -2,
                frustumSize * aspect / 2,
                frustumSize / 2,
                frustumSize / -2,
                0.1,
                1000
            );
            camera.position.set(2, 1.5, 4);
            camera.lookAt(0.5, 0, 0);
            
            // Renderer with white background
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0xffffff, 1);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(5, 10, 5);
            scene.add(pointLight);
            
            // Create surface (green plane) - laying flat
            const surfaceGeometry = new THREE.PlaneGeometry(6, 4);
            const surfaceMaterial = new THREE.MeshStandardMaterial({
                color: 0x76ff03,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.7,
                roughness: 0.5
            });
            surface = new THREE.Mesh(surfaceGeometry, surfaceMaterial);
            surface.rotation.x = -Math.PI / 2;
            scene.add(surface);
            
            // Surface edge outline - BLACK, thin 1px-like
            const edges = new THREE.EdgesGeometry(surfaceGeometry);
            const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1 });
            const edgeLines = new THREE.LineSegments(edges, edgeMaterial);
            edgeLines.rotation.x = -Math.PI / 2;
            scene.add(edgeLines);
            
            // Create incident ray (yellow)
            createIncidentRay();
            
            // Create normal vector (red)
            createNormalVector();
            
            // Create reflected rays (green) - 8 rays radially distributed
            createReflectedRays();
            
            // Add labels
            addLabels();
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('mouseleave', onMouseUp);
            renderer.domElement.addEventListener('wheel', onMouseWheel);
            
            animate();
        }
        
        function createIncidentRay() {
            incidentRayComponents = []; // <-- Clear the array
            const origin = new THREE.Vector3(-2, 3, 1);
            const direction = new THREE.Vector3(2, -3, -1).normalize();
            const length = 3.5;
            
            // Create gradient tube with multiple segments
            const segments = 50; // Increased from 20 for smoother animation
            const tubeRadius = 0.04;
            
            for (let i = 0; i < segments; i++) {
                const t1 = i / segments;
                const t2 = (i + 1) / segments;
                
                const point1 = origin.clone().add(direction.clone().multiplyScalar(length * t1));
                const point2 = origin.clone().add(direction.clone().multiplyScalar(length * t2));
                
                // Color gradient from yellow to red
                const color = new THREE.Color();
                color.r = 1;
                color.g = 1 - (t1 + t2) / 2;
                color.b = 0;
                
                const segmentLength = point1.distanceTo(point2);
                const tubeGeometry = new THREE.CylinderGeometry(tubeRadius, tubeRadius, segmentLength, 8);
                const tubeMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.7
                });
                const tube = new THREE.Mesh(tubeGeometry, tubeMaterial);
                
                // Position and orient the segment
                const midpoint = point1.clone().add(point2).multiplyScalar(0.5);
                tube.position.copy(midpoint);
                tube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
                
                scene.add(tube);
                incidentRayComponents.push(tube); // <-- Store segment
            }
            
            // Add arrowhead at the end (red)
            const arrowHead = new THREE.Mesh(
                new THREE.ConeGeometry(0.15, 0.4, 8),
                new THREE.MeshBasicMaterial({
                    color: 0xff0000,
                    transparent: true,
                    opacity: 0.7
                })
            );
            const endPoint = origin.clone().add(direction.clone().multiplyScalar(length));
            arrowHead.position.copy(endPoint);
            arrowHead.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            scene.add(arrowHead);
            incidentRayComponents.push(arrowHead); // <-- Store arrowhead
            
            incidentRay = { head: arrowHead };
        }
        
        function createNormalVector() {
            const surfaceNormal = new THREE.Vector3(0, 1, 0);
            
            const arrowHelper = new THREE.ArrowHelper(
                surfaceNormal,
                new THREE.Vector3(0, 0, 0),
                0.6,
                0x000000,
                0.15,
                0.12
            );
            scene.add(arrowHelper);
            normalVector = arrowHelper;
        }
        
        function createReflectedRays() {
            // Calculate the specular reflection direction first
            const incidentDir = new THREE.Vector3(2, -3, -1).normalize();
            const surfaceNormal = new THREE.Vector3(0, 1, 0);
            
            // Specular reflection: r = d - 2(d·n)n
            const dotProduct = incidentDir.dot(surfaceNormal);
            const specularDir = incidentDir.clone().sub(
                surfaceNormal.clone().multiplyScalar(2 * dotProduct)
            ).normalize();
            
            // Adjust specular direction slightly down
            specularDir.y *= 0.85;
            specularDir.normalize();
            
            // Create the main specular reflection ray (most prominent)
            const specularArrow = new THREE.ArrowHelper(
                specularDir,
                new THREE.Vector3(0, 0, 0),
                2.2,
                0x1a7a1a, // Darker, more prominent green
                0.35,
                0.25
            );
            scene.add(specularArrow);
            reflectedRays.push({arrow: specularArrow, isMain: true, baseLength: 2.2});
            
            // Add 7 diffuse rays distributed radially at low angles
            const numDiffuseRays = 7;
            
            for (let i = 0; i < numDiffuseRays; i++) {
                const angle = (i / numDiffuseRays) * Math.PI * 2;
                
                // Calculate direction - radially distributed at low angle (~20 degrees from plane)
                const radius = 1.5;
                const dirX = Math.cos(angle) * radius;
                const dirZ = Math.sin(angle) * radius;
                const dirY = 0.5;
                
                const direction = new THREE.Vector3(dirX, dirY, dirZ).normalize();
                const length = 1.6;
                const color = 0x6ed66e; // Lighter green
                
                const arrowHelper = new THREE.ArrowHelper(
                    direction,
                    new THREE.Vector3(0, 0, 0),
                    length,
                    color,
                    0.25,
                    0.18
                );
                
                // Less transparent diffuse rays (back to 60% opacity)
                arrowHelper.line.material.transparent = true;
                arrowHelper.line.material.opacity = 0.6;
                arrowHelper.cone.material.transparent = true;
                arrowHelper.cone.material.opacity = 0.6;
                
                scene.add(arrowHelper);
                reflectedRays.push({arrow: arrowHelper, isMain: false, baseLength: length});
            }
        }
        
        function addLabels() {
            const createTextSprite = (text, position, color = 0x000000, isBold = false, scale = [1, 0.5]) => {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d', { alpha: true, willReadFrequently: false });
                canvas.width = isBold ? 1024 : 256;
                canvas.height = isBold ? 256 : 128;
                
                // Explicitly set to transparent - no fill
                context.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw text
                context.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
                context.font = isBold ? '60px Arial' : 'Bold 40px Arial';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(text, canvas.width / 2, canvas.height / 2);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;
                texture.premultiplyAlpha = false;
                
                const spriteMaterial = new THREE.SpriteMaterial({ 
                    map: texture,
                    transparent: true,
                    opacity: 1.0,
                    depthTest: false,
                    depthWrite: false,
                    sizeAttenuation: false,
                    blending: THREE.NormalBlending
                });
                const sprite = new THREE.Sprite(spriteMaterial);
                sprite.position.copy(position);
                sprite.scale.set(scale[0], scale[1], 1);
                sprite.renderOrder = 999;
                scene.add(sprite);
            };
            
            createTextSprite('ℓ_in(λ)', new THREE.Vector3(-1, 2.5, 0.5), 0x000000);
            createTextSprite('n', new THREE.Vector3(0.3, 0.8, 0), 0x000000);
            createTextSprite('p', new THREE.Vector3(-0.6, 0.3, 0.3), 0x000000);
            createTextSprite('q', new THREE.Vector3(0.8, 0.3, 0.2), 0x000000);
            createTextSprite('ℓ_out = F(ℓ_in, n, λ, p, q)', new THREE.Vector3(2.5, 1.5, 0), 0x000000, true, [3, 0.75]);
        }
        
        function onMouseDown(event) {
            isDragging = true;
            previousMousePosition = {
                x: event.clientX,
                y: event.clientY
            };
        }
        
        function onMouseMove(event) {
            if (!isDragging) return;
            
            const deltaX = event.clientX - previousMousePosition.x;
            const deltaY = event.clientY - previousMousePosition.y;
            
            cameraRotation.theta += deltaX * 0.005;
            cameraRotation.phi += deltaY * 0.005;
            
            // Clamp phi to avoid flipping
            cameraRotation.phi = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraRotation.phi));
            
            previousMousePosition = {
                x: event.clientX,
                y: event.clientY
            };
        }
        
        function onMouseUp() {
            isDragging = false;
        }
        
        function onMouseWheel(event) {
            event.preventDefault();
            cameraDistance += event.deltaY * 0.01;
            cameraDistance = Math.max(2, Math.min(10, cameraDistance));
        }
        
        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 8;
            camera.left = frustumSize * aspect / -2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = frustumSize / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (animating) {
                time += 0.01;
                
                // --- Update camera based on mouse rotation ---
                const x = cameraDistance * Math.sin(cameraRotation.theta) * Math.cos(cameraRotation.phi);
                const y = cameraDistance * Math.sin(cameraRotation.phi) + 1.5;
                const z = cameraDistance * Math.cos(cameraRotation.theta) * Math.cos(cameraRotation.phi);
                
                camera.position.set(x + 0.5, y, z);
                camera.lookAt(0.5, 0, 0);
                
                // --- Stopped animating reflected rays ---
                /*
                reflectedRays.forEach((rayObj, i) => {
                    const scale = 1 + 0.1 * Math.sin(time * 2 + i);
                    rayObj.arrow.setLength(rayObj.baseLength * scale, 0.3 * scale, 0.2 * scale);
                });
                */
                
                // --- Animate reflected rays (bouncy) ---
                reflectedRays.forEach((rayObj, i) => {
                    const scale = 1 + 0.1 * Math.sin(time * 2 + i);
                    rayObj.arrow.setLength(rayObj.baseLength * scale, 0.3 * scale, 0.2 * scale);
                });
                
                // --- Animate incident ray (drawing from tail to arrowhead) ---
                // Create a progress value that cycles from 0 to 1 repeatedly with pause at end
                const animationSpeed = 0.5; // Slower speed
                const pauseDuration = 0.25; // 0.5 second pause (0.5 / (animationSpeed * 2))
                const cycleDuration = 1 + pauseDuration; // Total cycle time including pause
                const rawProgress = (time * animationSpeed) % cycleDuration;
                const progress = Math.min(rawProgress / 1, 1); // Clamp at 1 during pause
                
                // Show segments progressively based on progress with smoother transitions
                incidentRayComponents.forEach((component, index) => {
                    const segmentProgress = index / incidentRayComponents.length;
                    const fadeInRange = 2 / incidentRayComponents.length; // Adjusted fade range
                    
                    // Calculate how far into the fade-in this segment is
                    const localProgress = Math.max(0, Math.min(1, (progress - segmentProgress + fadeInRange) / fadeInRange));
                    
                    // Use smooth easing function for opacity and scale
                    const easedProgress = localProgress * localProgress * (3 - 2 * localProgress); // Smoothstep
                    
                    component.material.opacity = easedProgress * 0.7;
                    component.scale.y = Math.max(0.01, easedProgress);
                });
            }
            
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
