<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orthographic projection. Projection is done by parallel rays orthogonal to the projection plane. In this example, we have $x = X$ and $y = Y$.</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #ffffff;
        }
        .label {
            position: absolute;
            font-family: sans-serif;
            font-size: 13px;
            color: black;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://esm.sh/three';
        import { OrbitControls } from 'https://esm.sh/three/examples/jsm/controls/OrbitControls';
        
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        const aspect = window.innerWidth / window.innerHeight;
        const d = 5;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 100);
        camera.position.set(5, 5, 5);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 0.5);
        pointLight.position.set(5, 10, 5);
        scene.add(pointLight);
        
        const labels = [];
        const vector = new THREE.Vector3();
        
        function createLabel(text, pos) {
            const div = document.createElement('div');
            div.className = 'label';
            div.textContent = text;
            document.body.appendChild(div);
            labels.push({ div, pos });
        }
        
        function updateLabels() {
            labels.forEach(({ div, pos }) => {
                vector.copy(pos).project(camera);
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                div.style.left = `$${x}px`;
                div.style.top = `$${y}px`;
            });
        }
        

        // Plane: image_plane
        {
            const planeGeo = new THREE.PlaneGeometry(3, 2);
            const planeMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide,
                transparent: false,
                opacity: 1.0,
                roughness: 0.5
            });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.position.set(1, 0, 0);
            plane.rotation.set(0.0, -1.5707963267948966, 0.0);
            scene.add(plane);
            
            // Add edge outline
            const edges = new THREE.EdgesGeometry(planeGeo);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });
            const edgeLines = new THREE.LineSegments(edges, edgeMat);
            edgeLines.position.copy(plane.position);
            edgeLines.rotation.copy(plane.rotation);
            scene.add(edgeLines);
        }

        // Point: camera_center
        {
            const pointGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const pointMat = new THREE.MeshBasicMaterial({ color: 0x0 });
            const point = new THREE.Mesh(pointGeo, pointMat);
            point.position.set(0, 0, 0);
            scene.add(point);
        }

        // Plane: world_plane
        {
            const planeGeo = new THREE.PlaneGeometry(2, 1.2);
            const planeMat = new THREE.MeshStandardMaterial({
                color: 0xff9933,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.3,
                roughness: 0.5
            });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.position.set(3, -0.5, 0);
            plane.rotation.set(-1.2217304763960306, -1.0471975511965976, 0.0);
            scene.add(plane);
            
            // Add edge outline
            const edges = new THREE.EdgesGeometry(planeGeo);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });
            const edgeLines = new THREE.LineSegments(edges, edgeMat);
            edgeLines.position.copy(plane.position);
            edgeLines.rotation.copy(plane.rotation);
            scene.add(edgeLines);
        }

        // Axes: world_axes
        {
            const origin = new THREE.Vector3(3, -0.5, 0);
            const xAxis = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), origin, 0.5, 0xff0000);
            const yAxis = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), origin, 0.5, 0xff00);
            const zAxis = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), origin, 0.5, 0xff);
            scene.add(xAxis, yAxis, zAxis);
        }

        // Point: world_point
        {
            const pointGeo = new THREE.SphereGeometry(0.05, 16, 16);
            const pointMat = new THREE.MeshBasicMaterial({ color: 0xff });
            const point = new THREE.Mesh(pointGeo, pointMat);
            point.position.set(3.3, -0.3, 0);
            scene.add(point);
        }
// Projection: projection (to be implemented)

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
