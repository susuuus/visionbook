<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Linear, ReLU and L2-norm Mapping</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }
    .container {
      width: 31.33%;
      height: 100%;
      position: relative;
    }
    .title {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-family: serif;
      font-weight: bold;
      color: black;
      z-index: 10;
      pointer-events: none;
    }
    .label {
      position: absolute;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 18px;
      color: black;
      pointer-events: none;
      z-index: 10;
    }
    .ui-panel {
      position: absolute;
      top: 10px;
      left: -10px;
      background: rgba(255,255,255,0.9);
      padding: px;
      border-radius: 4px;
      font-family: sans-serif;
      z-index: 5;
    }
    .ui-panel label {
      font-size: 12px;
      display: block;
      margin: 4px 0 0;
    }
  </style>
</head>
<body>
  <div id="linear" class="container">
    <div class="title">linear</div>
    <div class="label xin" id="labelInLinear"><b>x<sub>in</sub></b></div>
    <div class="label xout" id="labelOutLinear"><b>x<sub>out</sub></b></div>
    <div class="ui-panel">
      <label>Rotate Y (°): <input id="rotY" type="range" min="-90" max="90" value="40"/></label>
      <label>Scale X: <input id="sX" type="range" min="0.2" max="2" step="0.05" value="1.0"/></label>
      <label>Scale Z: <input id="sZ" type="range" min="0.2" max="2" step="0.05" value="1.2"/></label>
      <label>Bias X: <input id="bX" type="range" min="-1" max="1" step="0.05" value="-0.7"/></label>
      <label>Bias Z: <input id="bZ" type="range" min="-1" max="1" step="0.05" value="0"/></label>
    </div>
  </div>
  <div id="relu" class="container">
    <div class="title">relu</div>
    <div class="label xin" id="labelInReLU"><b>x<sub>in</sub></b></div>
    <div class="label xout" id="labelOutReLU"><b>x<sub>out</sub></b></div>
  </div>
  <div id="norm" class="container">
    <div class="title">L2-norm</div>
    <div class="label xin" id="labelInNorm"><b>x<sub>in</sub></b></div>
    <div class="label xout" id="labelOutNorm"><b>x<sub>out</sub></b></div>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three';
    import { OrbitControls } from 'https://esm.sh/three/examples/jsm/controls/OrbitControls';

    function getParams() {
      return {
        theta: THREE.MathUtils.degToRad(parseFloat(document.getElementById('rotY').value)),
        wX: parseFloat(document.getElementById('sX').value),
        wZ: parseFloat(document.getElementById('sZ').value),
        bX: parseFloat(document.getElementById('bX').value),
        bZ: parseFloat(document.getElementById('bZ').value)
      };
    }
   
    function init(containerId, labelInId, labelOutId, mode = 'linear', zoom = 1, isRelu = false) {

      let isUserInteracting = false;
      const container = document.getElementById(containerId);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      const aspect = container.clientWidth / container.clientHeight;
      const d = 3;
      const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 20);
      if (isRelu) {
        camera.position.set(-3, 3.5, -3);
      } else {
        camera.position.set(3, 3.5, 3);
      }
      const radius = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
      const baseAzimuth = Math.atan2(camera.position.x, camera.position.z);
      const cameraTarget = new THREE.Vector3(0, 1.25, 0);

      camera.lookAt(0, 1.25, 0);
      camera.zoom = zoom;
      camera.updateProjectionMatrix();

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.addEventListener('start', () => {
        isUserInteracting = true;
      });
      controls.addEventListener('end', () => {
        isUserInteracting = false;
      });

      const planeSize = 2.5;
      const Y1 = -1.6, Y2 = 1;
      const corners = [
        [-planeSize / 2, -planeSize / 2],
        [planeSize / 2, -planeSize / 2],
        [planeSize / 2, planeSize / 2],
        [-planeSize / 2, planeSize / 2],
      ];

      const ptG = new THREE.SphereGeometry(0.025, 8, 8);
      const redM = new THREE.MeshBasicMaterial({ color: 0xff4444 });
      const blackDotMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const frameMat = new THREE.LineDashedMaterial({ color: 0x888888, dashSize: 0.05, gapSize: 0.025 });
      const lnM = new THREE.LineDashedMaterial({ color: 0xff4444, dashSize: 0.03, gapSize: 0.03 });

      const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
      const planeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
      const edgeGeo = new THREE.EdgesGeometry(planeGeo);
      const thickEdgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });
      const dashMat = new THREE.LineDashedMaterial({ color: 0x888888, dashSize: 0.05, gapSize: 0.025 });

      function addPlane(y) {
        const mesh = new THREE.Mesh(planeGeo, planeMat);
        mesh.position.y = y;
        mesh.rotation.x = -Math.PI / 2;
        scene.add(mesh);

        const edges = new THREE.LineSegments(edgeGeo, thickEdgeMat);
        edges.position.y = y;
        edges.rotation.x = -Math.PI / 2;
        scene.add(edges);

        const len = planeSize / 2;
        const hGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-len, y + 0.001, 0),
          new THREE.Vector3(len, y + 0.001, 0)
        ]);
        const vGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, y + 0.001, -len),
          new THREE.Vector3(0, y + 0.001, len)
        ]);

        const hLine = new THREE.Line(hGeo, dashMat.clone());
        const vLine = new THREE.Line(vGeo, dashMat.clone());
        hLine.computeLineDistances();
        vLine.computeLineDistances();
        scene.add(hLine, vLine);
      }

      addPlane(Y1);
      addPlane(Y2);

      const group = new THREE.Group();
      scene.add(group);
      
      const redPoints = [];
      const N = 24;

        for (let i = 0; i < N; i++) {
          for (let j = 0; j < N; j++) {
            let x = -0.8 + 1.6 * i / (N - 1) + (Math.random() - 0.5) * 0.15;
            let z = -0.8 + 1.6 * j / (N - 1) + (Math.random() - 0.5) * 0.15;
            if (Math.random() > Math.exp(-Math.hypot(x, z) * 2)) continue;
            redPoints.push([x, z]);
          }
        }

      function drawMapping() {
        group.clear();
        const { theta, wX, wZ, bX, bZ } = getParams();
        const cos = Math.cos(theta), sin = Math.sin(theta);

        const topCorners = corners.map(([x, z]) => {
          let xOut = x, zOut = z;
          if (mode === 'relu') {
            xOut = Math.max(0, x);
            zOut = Math.max(0, z);
          } else if (mode === 'norm') {
            const len = Math.hypot(x, z) || 1;
            const scale = planeSize / 2;  // match red points' radius
            xOut = (x / len) * scale;
            zOut = (z / len) * scale;
          } else {
            xOut = (x * cos - z * sin) * wX + bX;
            zOut = (x * sin + z * cos) * wZ + bZ;
          }
          return new THREE.Vector3(xOut, Y2, zOut);
        });

        for (let i = 0; i < 4; i++) {
          const [x, z] = corners[i];
          const bottom = new THREE.Vector3(x, Y1, z);
          const top = topCorners[i];
          const geo = new THREE.BufferGeometry().setFromPoints([bottom, top]);
          const line = new THREE.Line(geo, frameMat.clone());
          line.computeLineDistances();
          group.add(line);
        }

        topCorners.forEach(pos => {
          const dot = new THREE.Mesh(ptG, blackDotMat);
          dot.position.copy(pos);
          group.add(dot);
        });

        for (let i = 0; i < 4; i++) {
          const a = topCorners[i];
          const b = topCorners[(i + 1) % 4];
          const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
          const line = new THREE.Line(geo, frameMat.clone());
          line.computeLineDistances();
          group.add(line);
        }

        for (const [x, z] of redPoints) {
          const pIn = new THREE.Vector3(x, Y1, z);
          let xOut = x, zOut = z;

          if (mode === 'relu') {
            xOut = Math.max(0, x);
            zOut = Math.max(0, z);
          } else if (mode === 'norm') {
            const len = Math.sqrt(x * x + z * z) || 1;
            const scale = planeSize / 2;  // full radius to reach square sides
            xOut = (x / len) * scale;
            zOut = (z / len) * scale;
          } else {
            xOut = (x * cos - z * sin) * wX + bX;
            zOut = (x * sin + z * cos) * wZ + bZ;
          }

          const pOut = new THREE.Vector3(xOut, Y2, zOut);

          const dotIn = new THREE.Mesh(ptG, redM);
          const dotOut = new THREE.Mesh(ptG, redM);
          dotIn.position.copy(pIn);
          dotOut.position.copy(pOut);
          group.add(dotIn, dotOut);

          const geo = new THREE.BufferGeometry().setFromPoints([pIn, pOut]);
          const line = new THREE.Line(geo, lnM.clone());
          line.computeLineDistances();
          group.add(line);
        }
      }

      if (mode === 'linear') {
        ['rotY', 'sX', 'sZ', 'bX', 'bZ'].forEach(id => {
          document.getElementById(id).addEventListener('input', drawMapping);
        });
      }

      drawMapping();

      const labelIn = document.getElementById(labelInId);
      const labelOut = document.getElementById(labelOutId);
      let posIn, posOut;
      if (mode === 'relu') {
        posIn = new THREE.Vector3(1.7, Y1, -1.25);
        posOut = new THREE.Vector3(1.7, Y2, -1.25);
      } else {
        posIn = new THREE.Vector3(-1.7, Y1, 1.25);
        posOut = new THREE.Vector3(-1.7, Y2, 1.25);
      }

      const vec = new THREE.Vector3();

      function updateLabels() {
      camera.updateMatrixWorld(); 

      [[labelIn, posIn], [labelOut, posOut]].forEach(([el, pos]) => {
        vec.copy(pos).project(camera);

        const x = (vec.x * 0.5 + 0.5) * container.clientWidth;
        const y = (-vec.y * 0.5 + 0.5) * container.clientHeight;

        const xShift = -0.015 * container.clientWidth;
        const yShift = -0.015 * container.clientHeight;

        el.style.left = `${x + xShift}px`;
        el.style.top = `${y + yShift}px`;
      });
    }
      
      let t = 0;

      function animate() {
        requestAnimationFrame(animate);

        if (!isUserInteracting) {
          t += 0.005;
          const angle = baseAzimuth + Math.sin(t) * 0.2;
          camera.position.x = radius * Math.sin(angle);
          camera.position.z = radius * Math.cos(angle);
          camera.position.y = 3.5; // Keep original height
          camera.lookAt(cameraTarget);
          camera.updateProjectionMatrix();
        }

        controls.update();
        updateLabels();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        renderer.setSize(w, h);
        camera.left = -d * (w / h);
        camera.right = d * (w / h);
        camera.updateProjectionMatrix();
      });
    }

    init('linear', 'labelInLinear', 'labelOutLinear', 'linear', 0.73);
    init('relu', 'labelInReLU', 'labelOutReLU', 'relu', 0.73, true);
    init('norm', 'labelInNorm', 'labelOutNorm', 'norm', 0.73);
  </script>
</body>
</html>
