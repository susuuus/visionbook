<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Linear Mapping — Recordable Demo</title>
  <style>
    html, body, #container {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    .ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.95);
      padding: 8px;
      border-radius: 4px;
      font-family: sans-serif;
      z-index: 5;
    }
    .ui-panel label { display:block; font-size:12px; }
    .title { position: absolute; top: 12px; width:100%; text-align:center; font-size:20px; font-family:serif; font-weight:bold; color:black; pointer-events:none }
    .hide-ui .ui-panel { visibility: hidden !important; }
    .hide-ui .title { visibility: hidden !important; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div class="title" id="title">Linear mapping demo (recordable)</div>
  <div class="ui-panel" id="uiPanel">
    <label>Rotate Y (°): <input id="rotY" type="range" min="-90" max="90" value="30" /></label>
    <label>Scale X: <input id="sX" type="range" min="0.2" max="2" step="0.01" value="1.3" /></label>
    <label>Scale Z: <input id="sZ" type="range" min="0.2" max="2" step="0.01" value="1.2" /></label>
    <div style="margin-top:8px">
      <button id="playDemo">Play demo</button>
      <button id="recordBtn">Record demo (auto stops)</button>
      <a id="downloadLink" style="display:none">Download</a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three';
    import { OrbitControls } from 'https://esm.sh/three/examples/jsm/controls/OrbitControls';

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const aspect = container.clientWidth / container.clientHeight;
    const d = 3;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 20);
    camera.position.set(3, 3.5, 3);
    camera.lookAt(0, 1.25, 0);
    camera.zoom = 1;
    camera.updateProjectionMatrix();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const planeSize = 2.5;
    const Y1 = -1.6, Y2 = 1;
    const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
    const edgeGeo = new THREE.EdgesGeometry(planeGeo);
    const thickEdgeMat = new THREE.LineBasicMaterial({ color: 0x000000 });

    function addPlane(y) {
      const mesh = new THREE.Mesh(planeGeo, planeMat);
      mesh.position.y = y;
      mesh.rotation.x = -Math.PI / 2;
      scene.add(mesh);

      const edges = new THREE.LineSegments(edgeGeo, thickEdgeMat);
      edges.position.y = y;
      edges.rotation.x = -Math.PI / 2;
      scene.add(edges);

      const dashMat = new THREE.LineDashedMaterial({ color: 0x888888, dashSize: 0.05, gapSize: 0.025 });
      const len = planeSize / 2;

      const hGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-len, y + 0.001, 0),
        new THREE.Vector3(len, y + 0.001, 0)
      ]);
      const vGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, y + 0.001, -len),
        new THREE.Vector3(0, y + 0.001, len)
      ]);

      const hLine = new THREE.Line(hGeo, dashMat.clone());
      const vLine = new THREE.Line(vGeo, dashMat.clone());
      hLine.computeLineDistances();
      vLine.computeLineDistances();
      scene.add(hLine, vLine);
    }

    addPlane(Y1);
    addPlane(Y2);

    const frameMat = new THREE.LineDashedMaterial({ color: 0x888888, dashSize: 0.05, gapSize: 0.025 });
    const corners = [
      [-planeSize / 2, -planeSize / 2],
      [planeSize / 2, -planeSize / 2],
      [planeSize / 2, planeSize / 2],
      [-planeSize / 2, planeSize / 2],
    ];

    const ptG = new THREE.SphereGeometry(0.022, 8, 8);
    const redM = new THREE.MeshBasicMaterial({ color: 0xff4444 });
    const blackDotMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const lnM = new THREE.LineDashedMaterial({ color: 0xff4444, dashSize: 0.03, gapSize: 0.03 });

    const rotY = document.getElementById('rotY');
    const sX = document.getElementById('sX');
    const sZ = document.getElementById('sZ');

    let group;
    let cornerLines = [];

    const N = 24;
    let inputPoints = [];
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        let x = -0.8 + 1.6 * i / (N - 1) + (Math.random() - 0.5) * 0.15;
        let z = -0.8 + 1.6 * j / (N - 1) + (Math.random() - 0.5) * 0.15;
        if (Math.random() > Math.exp(-Math.hypot(x, z) * 2)) continue;
        inputPoints.push(new THREE.Vector3(x, Y1, z));
      }
    }

    function drawMapping() {
      if (group) scene.remove(group);
      group = new THREE.Group(); scene.add(group);
      cornerLines.forEach(line => scene.remove(line));
      cornerLines = [];

      const theta = THREE.MathUtils.degToRad(parseFloat(rotY.value));
      const wX = parseFloat(sX.value), wZ = parseFloat(sZ.value);
      const biasX = 0, biasZ = 0;
      const cos = Math.cos(theta), sin = Math.sin(theta);

      let topCorners = [];
      corners.forEach(([x, z]) => {
        const xOut = (x * cos - z * sin) * wX + biasX;
        const zOut = (x * sin + z * cos) * wZ + biasZ;
        topCorners.push(new THREE.Vector3(xOut, Y2, zOut));
      });

      for (let i = 0; i < 4; i++) {
        const [x, z] = corners[i];
        const bottom = new THREE.Vector3(x, Y1, z);
        const top = topCorners[i];
        const geo = new THREE.BufferGeometry().setFromPoints([bottom, top]);
        const line = new THREE.Line(geo, frameMat.clone());
        line.computeLineDistances();
        scene.add(line);
        cornerLines.push(line);
      }

      topCorners.forEach(pos => {
        const dot = new THREE.Mesh(ptG, blackDotMat);
        dot.position.copy(pos);
        group.add(dot);
      });

      for (let i = 0; i < 4; i++) {
        const a = topCorners[i];
        const b = topCorners[(i + 1) % 4];
        const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
        const line = new THREE.Line(geo, frameMat.clone());
        line.computeLineDistances();
        group.add(line);
      }

      for (let pIn of inputPoints) {
        let x0 = pIn.x, z0 = pIn.z;
        let x1 = (x0 * cos - z0 * sin) * wX + biasX;
        let z1 = (x0 * sin + z0 * cos) * wZ + biasZ;
        const pOut = new THREE.Vector3(x1, Y2, z1);

        const dotIn = new THREE.Mesh(ptG, redM);
        const dotOut = new THREE.Mesh(ptG, redM);
        dotIn.position.copy(pIn);
        dotOut.position.copy(pOut);
        group.add(dotIn, dotOut);

        const geo = new THREE.BufferGeometry().setFromPoints([pIn, pOut]);
        const line = new THREE.Line(geo, lnM.clone());
        line.computeLineDistances();
        group.add(line);
      }
    }

    [rotY, sX, sZ].forEach(el => el.addEventListener('input', drawMapping));
    drawMapping();

    function animateCameraAndRender() {
      requestAnimationFrame(animateCameraAndRender);
      controls.update();
      renderer.render(scene, camera);
    }
    animateCameraAndRender();

    window.addEventListener('resize', () => {
      const w = container.clientWidth, h = container.clientHeight;
      renderer.setSize(w, h);
      camera.left = -d * (w / h);
      camera.right = d * (w / h);
      camera.updateProjectionMatrix();
    });

    // Demo animation timeline (t from 0..1)
    function setDemoParams(t) {
      // ease-in-out
      function ease(x){return (1 - Math.cos(Math.PI * x)) / 2}
      const e = ease(t);
      // rotate from -30 to +60 deg
      rotY.value = (-30 + 90 * e).toFixed(2);
      // scale x 0.8 -> 1.6
      sX.value = (0.8 + 0.8 * e).toFixed(2);
      // scale z 0.8 -> 1.4
      sZ.value = (0.8 + 0.6 * e).toFixed(2);
      drawMapping();
    }

    // Play demo that animates params over durationMs milliseconds
    function playDemo(durationMs = 4000) {
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / durationMs);
        setDemoParams(t);
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    document.getElementById('playDemo').addEventListener('click', () => playDemo(4000));

    // Recording logic: record canvas via MediaRecorder (webm)
    async function recordDemo(durationMs = 4000) {
      const stream = renderer.domElement.captureStream(30); // 30 FPS
      const mime = 'video/webm;codecs=vp9';
      let options = { mimeType: mime };
      if (!MediaRecorder.isTypeSupported(mime)) {
        options = { mimeType: 'video/webm;codecs=vp8' };
      }
      const recorder = new MediaRecorder(stream, options);

      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        // create a temporary download link
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'linear_demo.webm';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
      };

      recorder.start();
      // start demo animation
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / durationMs);
        setDemoParams(t);
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);

      // stop after duration
      setTimeout(() => recorder.stop(), durationMs + 200);
    }

    document.getElementById('recordBtn').addEventListener('click', () => recordDemo(4000));

  </script>
</body>
</html>
